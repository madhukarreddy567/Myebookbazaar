name: Build release ZIP

# Trigger: push a tag like v1.0.1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, gd, bcmath, mysql
          coverage: none

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Build release ZIP (vendor/ included, secrets/tests excluded)
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP="myebookbazaar-${TAG}.zip"
          # NOTE: .env.example is deliberately INCLUDED (template for fresh installs).
          zip -qr "$ZIP" . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".env" ".env.backup" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "storage/app/private/*" \
            -x "*.sqlite" \
            -x ".phpunit.result.cache"
          ls -lh "$ZIP"
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"

      - name: Write SHA-256 checksum file
        run: |
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          cat "${ZIP_NAME}.sha256"

      - name: Create GitHub Release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          generate_release_notes: true
